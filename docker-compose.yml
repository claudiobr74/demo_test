services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: serenapsi
      POSTGRES_PASSWORD: serenapsi
      POSTGRES_DB: serenapsi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U serenapsi"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    env_file:
      - ./services/api/.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://serenapsi:serenapsi@postgres:5432/serenapsi
      ENVIRONMENT: development
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
